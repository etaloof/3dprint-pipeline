services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: webapp/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      DATA_DIR: /data
      SKILLS_DIR: /app/skills
      MCP_SSE_URL: ${MCP_SSE_URL:-https://nativedev.tail7d3518.ts.net:10001/sse}
      CLAUDE_MODE: ${CLAUDE_MODE:-auto}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      CLAUDE_TIMEOUT_S: ${CLAUDE_TIMEOUT_S:-600}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PIPELINE_MODE: ${PIPELINE_MODE:-auto}
      ONSHAPE_DEFAULT_DID: ${ONSHAPE_DEFAULT_DID:-}
      ONSHAPE_DEFAULT_WID: ${ONSHAPE_DEFAULT_WID:-}
      ONSHAPE_DEFAULT_EID: ${ONSHAPE_DEFAULT_EID:-}
      API_SECRET: ${API_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - app-data:/data
      - ../skills:/app/skills:ro
      - claude-credentials:/root/.claude
      - mcp-config:/tmp/3dpp_mcp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: ..
      dockerfile: webapp/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-net

  # Optional Tailscale sidecar for reaching Jarvis MCP on nativedev (tailnet only).
  # Enable with: docker compose --profile tailscale up
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    hostname: 3dprint-webapp
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - app-net

  # Optional CadQuery worker profile for heavy offline generation.
  cadquery-worker:
    build:
      context: ..
      dockerfile: webapp/Dockerfile.cadquery
    profiles: ["cadquery"]
    environment:
      DATA_DIR: /data
    volumes:
      - app-data:/data
    networks:
      - app-net

volumes:
  redis-data:
  app-data:
  claude-credentials:
  mcp-config:
  tailscale-state:

networks:
  app-net:
    driver: bridge
